<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenera — Reset Password</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #150F24;
    color: #F3EFE8;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { max-width: 360px; width: 100%; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p { color: #9B90B0; font-size: 14px; line-height: 1.5; }
  label { font-size: 12px; color: #9B90B0; display: block; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px;
    border: none; background: #201735; color: #F3EFE8; font-size: 15px;
  }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #E8A33D; color: #150F24; font-weight: 600; font-size: 15px;
    margin-top: 20px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  .message { margin-top: 16px; font-size: 14px; }
  .error { color: #e8734d; }
  .success { color: #3FA796; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p id="subtitle">Enter a new password for your Scenera account.</p>

    <label for="password">New password</label>
    <input id="password" type="password" placeholder="At least 6 characters" />

    <button id="submitBtn">Set new password</button>
    <p id="message" class="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://zjijnnebsgdfheahglnu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqaWpubmVic2dkZmhlYWhnbG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNjE1MjUsImV4cCI6MjA5ODYzNzUyNX0.2JooS4hW2vtTRiRT2Hj1roqDPFoQ6FibvAAQx3K9Uxo";

    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showError(text) {
      messageEl.textContent = text;
      messageEl.className = "message error";
      submitBtn.disabled = true;
    }

    let supabase;
    try {
      if (!SUPABASE_URL.startsWith("http") || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY_HERE") {
        throw new Error("This page hasn't been configured with real Supabase credentials yet.");
      }
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error("Supabase client failed to initialize:", err);
      showError("This page isn't set up correctly (" + err.message + "). Please contact support.");
    }

    if (supabase) {
      let hasRecoverySession = false;

      // Supabase puts the recovery token in the URL hash when the user
      // arrives here from the email link. The client SDK picks it up
      // automatically and fires this event once the session is ready.
      supabase.auth.onAuthStateChange((event, session) => {
        console.log("Auth event:", event);
        if (event === "PASSWORD_RECOVERY") {
          hasRecoverySession = true;
        }
      });

      // If the link is old/expired or was opened without the token,
      // there's nothing this page can do — tell the person clearly
      // instead of letting them submit into a black hole.
      setTimeout(() => {
        if (!hasRecoverySession) {
          supabase.auth.getSession().then(({ data }) => {
            if (!data.session) {
              showError("This reset link is invalid or has expired. Please request a new one from the app.");
            }
          });
        }
      }, 2000);

      submitBtn.addEventListener("click", async () => {
        const password = document.getElementById("password").value;
        if (password.length < 6) {
          messageEl.textContent = "Password must be at least 6 characters.";
          messageEl.className = "message error";
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "Saving…";

        const { error } = await supabase.auth.updateUser({ password });

        if (error) {
          console.error("updateUser error:", error);
          messageEl.textContent = error.message;
          messageEl.className = "message error";
          submitBtn.disabled = false;
          submitBtn.textContent = "Set new password";
        } else {
          messageEl.textContent = "Password updated! You can close this page and sign in with your new password in the app.";
          messageEl.className = "message success";
          submitBtn.textContent = "Done";
          document.getElementById("password").disabled = true;
        }
      });
    }
  </script>
</body>
</html>
