<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenera — Reset Password</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #150F24;
    color: #F3EFE8;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { max-width: 360px; width: 100%; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p { color: #9B90B0; font-size: 14px; line-height: 1.5; }
  label { font-size: 12px; color: #9B90B0; display: block; margin-bottom: 6px; margin-top: 16px; }
  .password-wrap { position: relative; }
  .password-wrap input {
    width: 100%; box-sizing: border-box; padding: 12px 44px 12px 12px; border-radius: 8px;
    border: none; background: #201735; color: #F3EFE8; font-size: 15px;
  }
  .toggle-eye {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    width: auto; margin-top: 0;
  }
  .toggle-eye svg { display: block; }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #E8A33D; color: #150F24; font-weight: 600; font-size: 15px;
    margin-top: 20px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  .message { margin-top: 16px; font-size: 14px; }
  .error { color: #e8734d; }
  .success { color: #3FA796; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p id="subtitle">Enter a new password for your Scenera account.</p>

    <label for="password">New password</label>
    <div class="password-wrap">
      <input id="password" type="password" placeholder="At least 6 characters" />
      <button type="button" class="toggle-eye" id="toggleEye" aria-label="Show password">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B90B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <button id="submitBtn">Set new password</button>
    <p id="message" class="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";

    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const toggleEyeBtn = document.getElementById("toggleEye");
    const eyeIcon = document.getElementById("eyeIcon");

    const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
    const EYE_CLOSED = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.6 18.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

    toggleEyeBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeIcon.innerHTML = isPassword ? EYE_CLOSED : EYE_OPEN;
      toggleEyeBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    });

    function showError(text) {
      messageEl.textContent = text;
      messageEl.className = "message error";
      submitBtn.disabled = true;
    }

    let supabaseClient;
    try {
      if (!SUPABASE_URL.startsWith("http") || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY_HERE") {
        throw new Error("This page hasn't been configured with real Supabase credentials yet.");
      }
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error("Supabase client failed to initialize:", err);
      showError("This page isn't set up correctly (" + err.message + "). Please contact support.");
    }

    if (supabaseClient) {
      let hasRecoverySession = false;

      // Supabase puts the recovery token in the URL hash when the user
      // arrives here from the email link. The client SDK picks it up
      // automatically and fires this event once the session is ready.
      supabaseClient.auth.onAuthStateChange((event, session) => {
        console.log("Auth event:", event);
        if (event === "PASSWORD_RECOVERY") {
          hasRecoverySession = true;
        }
      });

      // If the link is old/expired or was opened without the token,
      // there's nothing this page can do — tell the person clearly
      // instead of letting them submit into a black hole.
      setTimeout(() => {
        if (!hasRecoverySession) {
          supabaseClient.auth.getSession().then(({ data }) => {
            if (!data.session) {
              showError("This reset link is invalid or has expired. Please request a new one from the app.");
            }
          });
        }
      }, 2000);

      submitBtn.addEventListener("click", async () => {
        const password = document.getElementById("password").value;
        if (password.length < 6) {
          messageEl.textContent = "Password must be at least 6 characters.";
          messageEl.className = "message error";
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "Saving…";

        const { error } = await supabaseClient.auth.updateUser({ password });

        if (error) {
          console.error("updateUser error:", error);
          messageEl.textContent = error.message;
          messageEl.className = "message error";
          submitBtn.disabled = false;
          submitBtn.textContent = "Set new password";
        } else {
          messageEl.textContent = "Password updated! You can close this page and sign in with your new password in the app.";
          messageEl.className = "message success";
          submitBtn.textContent = "Done";
          document.getElementById("password").disabled = true;
        }
      });
    }
  </script>
</body>
</html>
